name: Build and attach release zip

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build
        run: |
          npm install
          npm run build

      - name: Package
        run: |
          mkdir -p release/${{ github.event.repository.name }}
          cp -r package.json index.html icon.png README.md LICENSE dist themes \
            release/${{ github.event.repository.name }}/
          cd release
          zip -r ../${{ github.event.repository.name }}-${{ github.ref_name }}.zip .

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          # package.json is attached on its own as well as inside the zip: every
          # marketplace reference release does this, and Logseq reads it for the
          # version and update checks.
          files: |
            ${{ github.event.repository.name }}-${{ github.ref_name }}.zip
            package.json
          generate_release_notes: true
